<svg viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F1E8"/>
      <stop offset="100%" stop-color="#EFE4D2"/>
    </linearGradient>
    <radialGradient id="plateGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#C9905E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A65A34" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="sageBlob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A9A5B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8A9A5B" stop-opacity="0.12"/>
    </linearGradient>
    <!-- dark vignette so white text + white search pill stay legible regardless of what's behind them -->
    <radialGradient id="textVignette" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#2A1D15" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#2A1D15" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2A1D15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1600" height="700" fill="url(#bgGrad)"/>

  <!-- soft ambient blobs, corners only -->
  <ellipse cx="140" cy="90" rx="220" ry="160" fill="url(#sageBlob)"/>
  <ellipse cx="1480" cy="90" rx="240" ry="170" fill="#A65A34" opacity="0.10"/>
  <ellipse cx="120" cy="640" rx="220" ry="160" fill="#3B2A20" opacity="0.07"/>
  <ellipse cx="1500" cy="640" rx="260" ry="180" fill="#8A9A5B" opacity="0.10"/>

  <!-- fine dot grain, corners only -->
  <g fill="#3B2A20" opacity="0.06">
    <circle cx="70" cy="40" r="3"/><circle cx="130" cy="70" r="3"/><circle cx="50" cy="150" r="3"/>
    <circle cx="1530" cy="50" r="3"/><circle cx="1470" cy="110" r="3"/><circle cx="1560" cy="170" r="3"/>
    <circle cx="180" cy="650" r="3"/><circle cx="250" cy="670" r="3"/><circle cx="110" cy="620" r="3"/>
    <circle cx="1400" cy="660" r="3"/><circle cx="1350" cy="620" r="3"/><circle cx="1460" cy="580" r="3"/>
  </g>

  <!-- signature element: plate with steam, tucked into bottom-right corner, well clear of center -->
  <g transform="translate(1400,560) scale(0.72)">
    <ellipse cx="0" cy="0" rx="230" ry="230" fill="url(#plateGlow)"/>
    <ellipse cx="0" cy="0" rx="230" ry="230" fill="none" stroke="#F7F1E8" stroke-width="6" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="150" ry="150" fill="none" stroke="#F7F1E8" stroke-width="3" opacity="0.35"/>

    <ellipse cx="-45" cy="-20" rx="70" ry="42" fill="#3B2A20" opacity="0.85"/>
    <ellipse cx="55" cy="10" rx="55" ry="34" fill="#8A9A5B" opacity="0.8"/>
    <ellipse cx="10" cy="-80" rx="48" ry="30" fill="#F7F1E8" opacity="0.9"/>

    <path d="M -20 -150 C -40 -200, 0 -220, -15 -270" stroke="#F7F1E8" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 30 -140 C 10 -190, 55 -210, 35 -260" stroke="#F7F1E8" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.45"/>
    <path d="M 80 -130 C 65 -170, 105 -190, 90 -235" stroke="#F7F1E8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- utensil + leaf line-icons, top-left and bottom-left corners only -->
  <g stroke="#3B2A20" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.16">
    <g transform="translate(140,600) rotate(-18)">
      <line x1="0" y1="0" x2="0" y2="90"/>
      <line x1="-14" y1="0" x2="-14" y2="34"/>
      <line x1="0" y1="0" x2="0" y2="34"/>
      <line x1="14" y1="0" x2="14" y2="34"/>
      <path d="M -14 34 Q 0 46 14 34"/>
    </g>
    <g transform="translate(220,110) rotate(20)">
      <path d="M 0 0 C 30 -10, 55 10, 60 45 C 30 40, 5 30, 0 0 Z"/>
      <line x1="0" y1="0" x2="60" y2="45"/>
    </g>
    <g transform="translate(90,90) rotate(12)">
      <line x1="0" y1="0" x2="0" y2="95"/>
      <path d="M -10 0 Q 0 -30 10 0 Z"/>
    </g>
  </g>

  <!-- dark vignette over the center band, keeps white heading + white search pill legible -->
  <rect width="1600" height="700" fill="url(#textVignette)"/>

  <!-- thin accent rule, subtle brand mark bottom-left, below the vignette so it stays quiet -->
  <g transform="translate(90,600)">
    <line x1="0" y1="0" x2="90" y2="0" stroke="#A65A34" stroke-width="4" stroke-linecap="round"/>
    <circle cx="105" cy="0" r="5" fill="#8A9A5B"/>
  </g>
</svg>
